name: Build local agent

# Packages app/server (terminal + Codex execution + project storage) into a single
# downloadable executable per OS, via app/server/build-agent.sh. Native modules
# (node-pty, sharp) ship platform-specific prebuilt binaries, so each OS has to be built
# on that actual OS — that's what the matrix below is for. Windows/Linux only per
# project decision; no macOS job.
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/server/**"
      - ".github/workflows/build-agent.yml"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build packaged agent
        run: bash build-agent.sh

      - uses: actions/upload-artifact@v4
        with:
          name: manga-agent-${{ matrix.os }}
          path: |
            app/server/dist-agent/manga-agent
            app/server/dist-agent/manga-agent.exe
            app/server/dist-agent/node_modules/**
          if-no-files-found: warn
